<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{emails/layout :: head('Reset your Garbigo password')}"></head>
<body style="margin:0; padding:0; background-color:#eef3ef;">
<th:block th:replace="~{emails/layout :: preheader('Use the secure link inside to choose a new Garbigo password.')}"></th:block>

<center style="width:100%; background-color:#eef3ef;">
    <!--[if mso]><table role="presentation" align="center" width="600" style="width:600px;"><tr><td><![endif]-->
    <table role="presentation" class="email-container" align="center" cellpadding="0" cellspacing="0" width="100%" style="max-width:600px; margin:0 auto;">
        <tr>
            <td class="outer-pad" style="padding:32px 12px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                       style="background-color:#ffffff; border:1px solid #dfe8e2; border-radius:16px; overflow:hidden;">

                    <th:block th:replace="~{emails/layout :: banner('Password reset', 'Choose a new password', 'info')}"></th:block>

                    <tr>
                        <td class="px" style="padding:36px 40px 20px 40px; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                            <p style="margin:0 0 16px 0; font-size:18px; line-height:1.5; font-weight:600; color:#14231c;">
                                Hi <span th:text="${name}">there</span>,
                            </p>
                            <p style="margin:0 0 16px 0; font-size:16px; line-height:1.65; color:#33423a;">
                                We received a request to reset the password on your Garbigo account.
                            </p>
                            <p style="margin:0 0 20px 0; font-size:16px; line-height:1.65; color:#33423a;">
                                Use the button below to choose a new one. For your safety, you will be signed out on all devices once it is changed.
                            </p>

                            <th:block th:with="resetUrl=${appUrl} + '/auth/reset-password/confirm?token=' + ${token}">
                                <th:block th:replace="~{emails/layout :: button(${resetUrl}, 'Reset my password', 'info')}"></th:block>
                                <th:block th:replace="~{emails/layout :: linkbox(${resetUrl})}"></th:block>
                            </th:block>

                            <th:block th:with="expiryText='This link works once and expires on ' + ${expiresAt} + '.'">
                                <th:block th:replace="~{emails/layout :: callout('Important', ${expiryText}, 'info')}"></th:block>
                            </th:block>

                            <th:block th:replace="~{emails/layout :: callout('Did not ask for this?', 'Ignore this email. Your password stays the same. If these emails keep arriving please contact support.', 'neutral')}"></th:block>
                        </td>
                    </tr>

                    <th:block th:replace="~{emails/layout :: footer(${email}, ${sentAt})}"></th:block>
                </table>
            </td>
        </tr>
    </table>
    <!--[if mso]></td></tr></table><![endif]-->
</center>
</body>
</html>
