<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{emails/layout :: head(${heading})}"></head>
<body style="margin:0; padding:0; background-color:#eef3ef;">
<th:block th:replace="~{emails/layout :: preheader(${preheader})}"></th:block>

<center style="width:100%; background-color:#eef3ef;">
    <!--[if mso]><table role="presentation" align="center" width="600" style="width:600px;"><tr><td><![endif]-->
    <table role="presentation" class="email-container" align="center" cellpadding="0" cellspacing="0" width="100%" style="max-width:600px; margin:0 auto;">
        <tr>
            <td class="outer-pad" style="padding:32px 12px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                       style="background-color:#ffffff; border:1px solid #dfe8e2; border-radius:16px; overflow:hidden;">

                    <th:block th:replace="~{emails/layout :: banner('Collector application', ${heading}, ${tone})}"></th:block>

                    <tr>
                        <td class="px" style="padding:36px 40px 20px 40px; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                            <p style="margin:0 0 16px 0; font-size:18px; line-height:1.5; font-weight:600; color:#14231c;">
                                Hi <span th:text="${name}">there</span>,
                            </p>
                            <p style="margin:0 0 24px 0; font-size:16px; line-height:1.65; color:#33423a;" th:text="${intro}">
                                Here is an update on your application.
                            </p>

                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                                   style="margin:0 0 24px 0; border:1px solid #e2e9e4; border-radius:12px; background-color:#f7faf8;">
                                <tr>
                                    <td class="stack" width="50%" valign="top" style="padding:16px 18px; border-bottom:1px solid #e6ede8; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                                        <div style="font-size:11px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; color:#6b7a72; margin-bottom:6px;">Reference</div>
                                        <div style="font-size:15px; font-weight:700; letter-spacing:0.5px; color:#14231c;" th:text="${reference}">GCA-2026-000001</div>
                                    </td>
                                    <td class="stack" width="50%" valign="top" style="padding:16px 18px; border-bottom:1px solid #e6ede8; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                                        <div style="font-size:11px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; color:#6b7a72; margin-bottom:6px;">Status</div>
                                        <span th:replace="~{emails/layout :: pill(${statusLabel}, ${tone})}">In review</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="stack" width="50%" valign="top" style="padding:16px 18px; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                                        <div style="font-size:11px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; color:#6b7a72; margin-bottom:6px;">Updated</div>
                                        <div style="font-size:14px; color:#14231c;" th:text="${updatedAt}">08 Oct 2026, 10:00 UTC</div>
                                    </td>
                                    <td class="stack" width="50%" valign="top" style="padding:16px 18px; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                                        <div style="font-size:11px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; color:#6b7a72; margin-bottom:6px;">Applying for</div>
                                        <div style="font-size:14px; color:#14231c;" th:text="${applyingFor}">Garbigo collector</div>
                                    </td>
                                </tr>
                            </table>

                            <th:block th:if="${note != null and !#strings.isEmpty(note)}">
                                <th:block th:replace="~{emails/layout :: callout(${noteTitle}, ${note}, ${tone})}"></th:block>
                            </th:block>

                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 22px 0;"
                                   th:if="${items != null and !items.isEmpty()}">
                                <tr>
                                    <td bgcolor="#fff4e0" style="background-color:#fff4e0; border:1px solid #fbd38d; border-radius:12px; padding:16px 20px; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                                        <p style="margin:0 0 10px 0; font-size:14px; font-weight:700; color:#6b3a07;" th:text="${itemsTitle}">Needs your attention</p>
                                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                                            <tr th:each="item : ${items}">
                                                <td width="16" valign="top" style="font-size:14px; line-height:1.6; color:#b45309;">&bull;</td>
                                                <td style="font-size:14px; line-height:1.6; color:#4a3410; padding-bottom:4px;" th:text="${item}">Item</td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                            <p style="margin:6px 0 14px 0; font-size:16px; font-weight:700; color:#14231c;">What happens next</p>
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px 0;">
                                <th:block th:each="step, stat : ${steps}">
                                    <th:block th:replace="~{emails/layout :: step(${stat.count}, ${step}, ${tone})}"></th:block>
                                </th:block>
                            </table>

                            <th:block th:if="${ctaUrl != null}">
                                <th:block th:replace="~{emails/layout :: button(${ctaUrl}, ${ctaLabel}, ${tone})}"></th:block>
                            </th:block>

                            <p style="margin:0 0 8px 0; font-size:14px; line-height:1.6; color:#6b7a72;">
                                Questions? Reply to this email and quote your reference number.
                            </p>
                        </td>
                    </tr>

                    <th:block th:replace="~{emails/layout :: footer(${email}, ${sentAt})}"></th:block>
                </table>
            </td>
        </tr>
    </table>
    <!--[if mso]></td></tr></table><![endif]-->
</center>
</body>
</html>
