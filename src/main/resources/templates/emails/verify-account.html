<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{emails/layout :: head('Verify your Garbigo account')}"></head>
<body style="margin:0; padding:0; background-color:#eef3ef;">
<th:block th:replace="~{emails/layout :: preheader('Confirm your email address to finish setting up your Garbigo account.')}"></th:block>

<center style="width:100%; background-color:#eef3ef;">
    <!--[if mso]><table role="presentation" align="center" width="600" style="width:600px;"><tr><td><![endif]-->
    <table role="presentation" class="email-container" align="center" cellpadding="0" cellspacing="0" width="100%" style="max-width:600px; margin:0 auto;">
        <tr>
            <td class="outer-pad" style="padding:32px 12px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                       style="background-color:#ffffff; border:1px solid #dfe8e2; border-radius:16px; overflow:hidden;">

                    <th:block th:replace="~{emails/layout :: banner('Account verification', 'Welcome to Garbigo', 'success')}"></th:block>

                    <tr>
                        <td class="px" style="padding:36px 40px 20px 40px; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                            <p style="margin:0 0 16px 0; font-size:18px; line-height:1.5; font-weight:600; color:#14231c;">
                                Hi <span th:text="${name}">there</span>,
                            </p>
                            <p style="margin:0 0 16px 0; font-size:16px; line-height:1.65; color:#33423a;">
                                Thank you for signing up. You are one step away from joining the Garbigo community.
                            </p>
                            <p style="margin:0 0 20px 0; font-size:16px; line-height:1.65; color:#33423a;">
                                Confirm that this email address is yours to activate your account.
                            </p>

                            <th:block th:with="verifyUrl=${appUrl} + '/auth/verify?token=' + ${token}">
                                <th:block th:replace="~{emails/layout :: button(${verifyUrl}, 'Verify my email address', 'success')}"></th:block>
                                <th:block th:replace="~{emails/layout :: linkbox(${verifyUrl})}"></th:block>
                            </th:block>

                            <th:block th:with="expiryText='This link expires on ' + ${expiresAt} + '. After that you can request a new one from the sign-in page.'">
                                <th:block th:replace="~{emails/layout :: callout('Time limit', ${expiryText}, 'success')}"></th:block>
                            </th:block>

                            <p style="margin:0 0 8px 0; font-size:14px; line-height:1.6; color:#6b7a72;">
                                If you did not create a Garbigo account, you can safely ignore this email. Nothing happens unless the link is opened.
                            </p>
                        </td>
                    </tr>

                    <th:block th:replace="~{emails/layout :: footer(${email}, ${sentAt})}"></th:block>
                </table>
            </td>
        </tr>
    </table>
    <!--[if mso]></td></tr></table><![endif]-->
</center>
</body>
</html>
