server:
  port: 8080

spring:
  application:
    name: auth-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/garbigo_auth
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  mail:
    host: smtp.gmail.com
    port: 587
    username: thepeacemakerske@gmail.com
    password:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ====================== MULTIPART CONFIGURATION ======================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

cloudinary:
  cloud-name: thepeacemakersllc
  api-key: 
  api-secret: 

jwt:
  secret: 
  expiration: 2592000

rate-limit:
  requests-per-minute: 20

rabbitmq:
  queue:
    user-created: user-created-queue

app:
  url: http://localhost:3000

google:
  client-id: 

facebook:
  app-id: 
  app-secret: 

github:
  client-id: 
  client-secret: 