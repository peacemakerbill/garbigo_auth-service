server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: auth-service

  # MongoAutoConfiguration doesn't actually depend on Spring Data, so its connection
  # properties live at spring.mongodb.* (not spring.data.mongodb.*) as of Spring Boot 4.
  # Properties that genuinely are Spring Data MongoDB concerns keep the data. prefix.
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/garbigo_auth}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ====================== MULTIPART CONFIGURATION ======================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:2592000}

internal:
  api-key: ${INTERNAL_API_KEY}

rate-limit:
  requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:20}

rabbitmq:
  queue:
    user-created: ${RABBITMQ_QUEUE_USER_CREATED:user-created-queue}

app:
  url: ${APP_URL:http://localhost:3000}

google:
  client-id: ${GOOGLE_CLIENT_ID}

facebook:
  app-id: ${FACEBOOK_APP_ID}
  app-secret: ${FACEBOOK_APP_SECRET}

github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}