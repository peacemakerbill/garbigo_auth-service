server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: auth-service

  # MongoAutoConfiguration doesn't actually depend on Spring Data, so its connection
  # properties live at spring.mongodb.* (not spring.data.mongodb.*) as of Spring Boot 4.
  # Properties that genuinely are Spring Data MongoDB concerns keep the data. prefix.
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/garbigo_auth}

  data:
    mongodb:
      auto-index-creation: false
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

  # ====================== MULTIPART CONFIGURATION ======================
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:2592000}

internal:
  api-key: ${INTERNAL_API_KEY}

rate-limit:
  requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:20}

rabbitmq:
  queue:
    user-created: ${RABBITMQ_QUEUE_USER_CREATED:user-created-queue}

app:
  url: ${APP_URL:http://localhost:3000}

  admin:
    seed-enabled: ${ADMIN_SEED_ENABLED:true}
    min-password-length: ${ADMIN_SEED_MIN_PASSWORD_LENGTH:12}
    seed:
      - email: ${ADMIN_1_EMAIL:}
        username: ${ADMIN_1_USERNAME:}
        first-name: ${ADMIN_1_FIRST_NAME:}
        middle-name: ${ADMIN_1_MIDDLE_NAME:}
        last-name: ${ADMIN_1_LAST_NAME:}
        phone-number: ${ADMIN_1_PHONE:}
        password: ${ADMIN_1_PASSWORD:}
      - email: ${ADMIN_2_EMAIL:}
        username: ${ADMIN_2_USERNAME:}
        first-name: ${ADMIN_2_FIRST_NAME:}
        middle-name: ${ADMIN_2_MIDDLE_NAME:}
        last-name: ${ADMIN_2_LAST_NAME:}
        phone-number: ${ADMIN_2_PHONE:}
        password: ${ADMIN_2_PASSWORD:}
      - email: ${ADMIN_3_EMAIL:}
        username: ${ADMIN_3_USERNAME:}
        first-name: ${ADMIN_3_FIRST_NAME:}
        middle-name: ${ADMIN_3_MIDDLE_NAME:}
        last-name: ${ADMIN_3_LAST_NAME:}
        phone-number: ${ADMIN_3_PHONE:}
        password: ${ADMIN_3_PASSWORD:}

  security:
    initial-admin-emails: ${INITIAL_ADMIN_EMAILS:}
    auto-admin-emails: ${AUTO_ADMIN_EMAILS:}
    admin-invitation-resend-days: ${SECURITY_ADMIN_INVITATION_RESEND_DAYS:7}
    admin-register-path: ${SECURITY_ADMIN_REGISTER_PATH:/register}
    admin-verification-requires-new-password: ${SECURITY_ADMIN_VERIFICATION_REQUIRES_NEW_PASSWORD:true}

    login-email-notifications: ${SECURITY_LOGIN_EMAIL_NOTIFICATIONS:true}
    new-device-alerts: ${SECURITY_NEW_DEVICE_ALERTS:true}
    notify-untrusted-devices: ${SECURITY_NOTIFY_UNTRUSTED_DEVICES:true}
    suspicious-login-alerts: ${SECURITY_SUSPICIOUS_LOGIN_ALERTS:true}
    notification-cooldown-minutes: ${SECURITY_NOTIFICATION_COOLDOWN_MINUTES:60}
    suspicious-alert-cooldown-minutes: ${SECURITY_SUSPICIOUS_ALERT_COOLDOWN_MINUTES:15}

    device-trust-enabled: ${SECURITY_DEVICE_TRUST_ENABLED:true}
    session-revocation-enabled: ${SECURITY_SESSION_REVOCATION_ENABLED:true}
    allow-untracked-tokens: ${SECURITY_ALLOW_UNTRACKED_TOKENS:true}
    report-revokes-all-sessions: ${SECURITY_REPORT_REVOKES_ALL_SESSIONS:true}
    max-devices-per-user: ${SECURITY_MAX_DEVICES_PER_USER:50}
    recent-auth-minutes: ${SECURITY_RECENT_AUTH_MINUTES:15}
    action-token-ttl-minutes: ${SECURITY_ACTION_TOKEN_TTL_MINUTES:1440}

    device-cookie-name: ${SECURITY_DEVICE_COOKIE_NAME:gb_device}
    device-cookie-secure: ${SECURITY_DEVICE_COOKIE_SECURE:true}
    device-cookie-same-site: ${SECURITY_DEVICE_COOKIE_SAME_SITE:Lax}
    device-cookie-days: ${SECURITY_DEVICE_COOKIE_DAYS:180}

    trusted-proxies: ${SECURITY_TRUSTED_PROXIES:}

    ip-geolocation-enabled: ${SECURITY_IP_GEOLOCATION_ENABLED:false}
    ip-geolocation-url: ${SECURITY_IP_GEOLOCATION_URL:https://ipinfo.io/{ip}/json}
    ip-geolocation-token: ${SECURITY_IP_GEOLOCATION_TOKEN:}
    ip-geolocation-timeout-ms: ${SECURITY_IP_GEOLOCATION_TIMEOUT_MS:2000}

    max-failed-logins-per-email-and-ip: ${SECURITY_MAX_FAILED_LOGINS_PER_EMAIL_AND_IP:5}
    max-failed-logins-per-ip: ${SECURITY_MAX_FAILED_LOGINS_PER_IP:30}
    max-failed-logins-per-email: ${SECURITY_MAX_FAILED_LOGINS_PER_EMAIL:20}
    failure-window-minutes: ${SECURITY_FAILURE_WINDOW_MINUTES:15}
    lockout-minutes: ${SECURITY_LOCKOUT_MINUTES:5}
    max-lockout-minutes: ${SECURITY_MAX_LOCKOUT_MINUTES:60}

    suspicious-window-minutes: ${SECURITY_SUSPICIOUS_WINDOW_MINUTES:60}
    suspicious-failed-threshold: ${SECURITY_SUSPICIOUS_FAILED_THRESHOLD:5}
    suspicious-address-threshold: ${SECURITY_SUSPICIOUS_ADDRESS_THRESHOLD:3}
    suspicious-frequency-threshold: ${SECURITY_SUSPICIOUS_FREQUENCY_THRESHOLD:10}

    audit-retention-days: ${SECURITY_AUDIT_RETENTION_DAYS:180}
    retention-interval-minutes: ${SECURITY_RETENTION_INTERVAL_MINUTES:360}

    display-time-zone: ${SECURITY_DISPLAY_TIME_ZONE:UTC}
    security-review-path: ${SECURITY_REVIEW_PATH:/account/security}
    report-path: ${SECURITY_REPORT_PATH:/account/security/report}

    hide-account-existence-on-signup: ${SECURITY_HIDE_ACCOUNT_EXISTENCE_ON_SIGNUP:false}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  drive:
    client-id: ${GOOGLE_DRIVE_CLIENT_ID:}
    client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:}
    refresh-token: ${GOOGLE_DRIVE_REFRESH_TOKEN:}
    root-folder-id: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:}
    root-folder-name: ${GOOGLE_DRIVE_ROOT_FOLDER_NAME:Garbigo Collector Applications}

collector-application:
  max-file-mb: ${COLLECTOR_APPLICATION_MAX_FILE_MB:5}
  review-days: ${COLLECTOR_APPLICATION_REVIEW_DAYS:3}
  page-path: ${COLLECTOR_APPLICATION_PAGE_PATH:/collector/application}

facebook:
  app-id: ${FACEBOOK_APP_ID}
  app-secret: ${FACEBOOK_APP_SECRET}

github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}

logging:
  level:
    "[com.garbigo]": DEBUG
    "[org.springframework.data.mongodb]": WARN
    "[org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport]": ERROR
    "[org.springframework.cloud.commons.util.InetUtils]": ERROR
