<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garbigo Google Sign-In Test</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 32px 16px; color: #222; }
        .card { max-width: 760px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        h1 { margin: 0 0 4px 0; font-size: 22px; color: #2e7d32; }
        p.sub { margin: 0 0 24px 0; color: #666; font-size: 14px; }
        label { display: block; font-size: 13px; font-weight: bold; margin: 16px 0 6px 0; }
        input[type=text] { width: 100%; box-sizing: border-box; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 10px 18px; font-size: 14px; border: 0; border-radius: 6px; background: #2e7d32; color: #fff; cursor: pointer; margin-top: 12px; margin-right: 8px; }
        button.secondary { background: #607d8b; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        #googleButton { margin-top: 16px; min-height: 44px; }
        pre { background: #1e1e1e; color: #e6e6e6; padding: 14px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; word-break: break-all; margin: 8px 0 0 0; }
        textarea { width: 100%; box-sizing: border-box; height: 110px; font-family: monospace; font-size: 12px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        .ok { color: #2e7d32; font-weight: bold; }
        .bad { color: #d32f2f; font-weight: bold; }
        h2 { font-size: 15px; margin: 28px 0 0 0; }
    </style>
</head>
<body>
<div class="card">
    <h1>Google Sign-In Test</h1>
    <p class="sub">Gets a real Google ID token, shows what is inside it, and sends it to your auth service.</p>

    <label for="clientId">Google Client ID (same value as GOOGLE_CLIENT_ID in your .env)</label>
    <input type="text" id="clientId" placeholder="123456789-abc.apps.googleusercontent.com">

    <label for="apiBase">Auth service base URL</label>
    <input type="text" id="apiBase" value="http://localhost:8080">

    <button id="loadBtn">Load Google button</button>
    <div id="googleButton"></div>

    <h2>ID token</h2>
    <textarea id="tokenBox" readonly placeholder="Appears here after you sign in with Google"></textarea>
    <button id="copyBtn" class="secondary" disabled>Copy token</button>

    <h2>Decoded claims</h2>
    <pre id="claims">Nothing yet.</pre>
    <div id="audCheck" style="margin-top:8px; font-size:13px;"></div>

    <h2>Backend call</h2>
    <button id="sendBtn" disabled>POST to /auth/social/google</button>
    <pre id="output">Nothing yet.</pre>
</div>

<script>
    let idToken = null;

    const clientIdInput = document.getElementById('clientId');
    const apiBaseInput = document.getElementById('apiBase');
    const tokenBox = document.getElementById('tokenBox');
    const claimsBox = document.getElementById('claims');
    const audCheck = document.getElementById('audCheck');
    const output = document.getElementById('output');
    const sendBtn = document.getElementById('sendBtn');
    const copyBtn = document.getElementById('copyBtn');

    function decodeJwtPayload(token) {
        const part = token.split('.')[1];
        const b64 = part.replace(/-/g, '+').replace(/_/g, '/');
        const padded = b64 + '='.repeat((4 - (b64.length % 4)) % 4);
        const json = decodeURIComponent(
            atob(padded).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join('')
        );
        return JSON.parse(json);
    }

    function handleCredentialResponse(response) {
        idToken = response.credential;
        tokenBox.value = idToken;
        sendBtn.disabled = false;
        copyBtn.disabled = false;

        const claims = decodeJwtPayload(idToken);
        const shown = {
            aud: claims.aud,
            azp: claims.azp,
            iss: claims.iss,
            email: claims.email,
            email_verified: claims.email_verified,
            name: claims.name,
            issued_at: new Date(claims.iat * 1000).toISOString(),
            expires_at: new Date(claims.exp * 1000).toISOString()
        };
        claimsBox.textContent = JSON.stringify(shown, null, 2);

        const entered = clientIdInput.value.trim();
        if (claims.aud === entered) {
            audCheck.innerHTML = '<span class="ok">aud matches the Client ID you entered.</span> It must also match GOOGLE_CLIENT_ID in the backend .env.';
        } else {
            audCheck.innerHTML = '<span class="bad">aud does not match the Client ID you entered.</span>';
        }
    }

    document.getElementById('loadBtn').addEventListener('click', function () {
        const clientId = clientIdInput.value.trim();
        if (!clientId) {
            output.textContent = 'Enter your Google Client ID first.';
            return;
        }
        if (typeof google === 'undefined' || !google.accounts) {
            output.textContent = 'Google script has not loaded. Check your internet connection and that this page is served over http://localhost, not opened as a file.';
            return;
        }
        const container = document.getElementById('googleButton');
        container.innerHTML = '';
        google.accounts.id.initialize({
            client_id: clientId,
            callback: handleCredentialResponse
        });
        google.accounts.id.renderButton(container, {
            theme: 'outline',
            size: 'large',
            text: 'continue_with'
        });
        output.textContent = 'Google button loaded. Click it to sign in.';
    });

    copyBtn.addEventListener('click', function () {
        navigator.clipboard.writeText(idToken).then(function () {
            output.textContent = 'Token copied to clipboard.';
        });
    });

    sendBtn.addEventListener('click', async function () {
        const base = apiBaseInput.value.trim().replace(/\/+$/, '');
        output.textContent = 'Sending...';
        try {
            const res = await fetch(base + '/auth/social/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: idToken })
            });
            const text = await res.text();
            let pretty = text;
            try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch (e) {}
            output.textContent = 'HTTP ' + res.status + '\n\n' + pretty;
        } catch (e) {
            output.textContent = 'Request failed: ' + e.message + '\n\nIs the auth service running? You can also copy the ID token above and send it from Postman.';
        }
    });
</script>
</body>
</html>
